name: Security Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: gitleaks/gitleaks-action@ff98108588ef9656d6318789e21c73d26aa4c8cf  # v2.3.7
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        # Advisory period: set fail-on-error to true after 2 weeks
        continue-on-error: ${{ vars.GITLEAKS_ADVISORY == 'true' }}

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: aquasecurity/trivy-action@18ad7f6ba50b5a33f0c992f7ef95bd4ccdd2449b  # 0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-sca.sarif'
      - uses: github/codeql-action/upload-sarif@6013510dec5114bb8e0e6366a79f7e2f62e5cd40  # v3.28.5
        with:
          sarif_file: 'trivy-sca.sarif'

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
        # Pin Semgrep image via config if using docker; always use specific version tags
        continue-on-error: ${{ vars.SAST_ADVISORY == 'true' }}

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: bridgecrewio/checkov-action@16b6f066f95264665a4f9adc6a0daac38fd8eaab  # v12.2990.0
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          output_format: sarif
          output_file_path: reports/checkov.sarif
        continue-on-error: ${{ vars.IAC_ADVISORY == 'true' }}

  dast:
    if: github.ref == 'refs/heads/staging' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: DAST scan against staging
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable:2.16.0 zap-baseline.py -t ${{ vars.STAGING_URL }} -J dast-report.json
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        continue-on-error: ${{ vars.DAST_ADVISORY == 'true' }}
